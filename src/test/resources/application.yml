spring:
  application:
    name: zbank-fraud-engine-test

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:zbank_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    listener:
      auto-startup: false
