spring:
  application:
    name: zbank-fraud-engine
  
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:zbank_fraud}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Automatically creates tables for local dev
    show-sql: true      # Prints SQL queries to the console for debugging
    properties:
      hibernate:
  
  kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      producer:
        # Automatically convert our Java Records into JSON before sending to Kafka
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      consumer:
        # Automatically convert incoming JSON back into Java Records
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        group-id: zbank-fraud-group
        properties:
          spring.json.trusted.packages: "*"    

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

