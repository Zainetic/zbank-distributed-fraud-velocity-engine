name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven verify
        run: |
          mvn -B -Djava.net.preferIPv4Stack=true verify || {
            echo "::error::Maven verify failed. Printing surefire test reports:"
            if [ -d target/surefire-reports ]; then
              echo "### ❌ Surefire Test Failures" >> $GITHUB_STEP_SUMMARY
              for f in target/surefire-reports/*.txt; do
                echo "================ $f ================"
                cat "$f"
                echo "#### $(basename "$f")" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$f" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
              done
            fi
            exit 1
          }
